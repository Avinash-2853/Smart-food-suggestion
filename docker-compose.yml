version: "3.8"

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: sm_food_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smart_food
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_food"]
      interval: 5s
      timeout: 5s
      retries: 5

  seeder:
    build:
      context: ./backend
      dockerfile: Dockerfile.seeder
    container_name: sm_food_seeder
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/seed-data
      - ./backend/scripts:/app/scripts
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/smart_food
      QDRANT_URL: http://qdrant:6333

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: sm_food_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage

volumes:
  pgdata:
